version: "3"

tasks:
  dev:
    desc: Start the dev server (http://localhost:3000)
    cmds:
      - pnpm dev

  build:
    desc: Production build
    cmds:
      - pnpm build

  lint:
    desc: ESLint + TypeScript
    cmds:
      - pnpm exec tsc --noEmit
      - pnpm lint

  deploy:
    desc: Deploy to Vercel production (team muehlemann-popp)
    cmds:
      - vercel deploy --prod

  test:
    desc: Unit tests (rules, name matching, register parser)
    cmds:
      - pnpm test

  check:
    desc: 'SwissVR check of one person, e.g. task check -- "Hans Muster, Beispiel AG, Bern"'
    cmds:
      - pnpm -s cli check {{.CLI_ARGS}}

  batch:
    desc: 'SwissVR check of a CSV, e.g. task batch -- personen.csv -o ergebnis.csv'
    cmds:
      - pnpm -s cli batch {{.CLI_ARGS}}

  eval:
    desc: 'Run against the SwissVR sample, e.g. task eval -- sample.csv -o eval.csv'
    cmds:
      - pnpm -s cli eval {{.CLI_ARGS}}

  resolve:
    desc: 'Company name -> UID, e.g. task resolve -- "Muehlemann und Pop"'
    cmds:
      - pnpm -s cli resolve {{.CLI_ARGS}}
